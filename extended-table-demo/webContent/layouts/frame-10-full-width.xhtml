<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions"
  xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
  
<!--
DESCRIPTION:
This is the default template with right aligned labels to use the freya-ivy theme as well as iFrames approach.

PORTAL:
If you are using the Axon Ivy Portal, you can pass several parameters to it to use some features (e.g. process chain).
You'll find the list of parameters here: https://developer.axonivy.com/portal/10.0/doc/portal-developer-guide/components/layout-templates.html#components-layout-templates-iframe-task-template
For further information about iframes and usage in Portal please refer to: https://developer.axonivy.com/portal/10.0/doc/portal-developer-guide/iframe/index.html

BRANDING:
If you want to brand your dialogs, please take a look at our documentation: https://developer.axonivy.com/doc/10.0/designer-guide/user-interface/branding/index.html

STYLING:
If you want to add custom styles, you can simply add your own .css file (e.g. at the location: "webContent/layouts/styles/style.css")
and refence it below in the head part.
-->
  
<h:head>
  <f:attribute name="primefaces.THEME" value="#{ivyFreyaTheme.theme}" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><ui:insert name="title">Ivy Html Dialog</ui:insert></title>
  <link rel="shortcut icon" href="#{resource['ivy-branding:favicon']}" />
  <h:outputScript name="js/layout.js" library="#{ivyFreyaTheme.library}" />
  <h:outputStylesheet name="#{ivyFreyaTheme.layout}" library="#{ivyFreyaTheme.library}" />
  <h:outputStylesheet name="primeflex-2.min.css" library="primeflex" />
  <h:outputStylesheet name="custom.css" library="ivy-branding" />
  <h:outputStylesheet name="prism.css" library="css"/>
  <h:outputScript name="prism.js" target="body" library="js"/>
  <!-- Optional Style or Script files: 
  <h:outputStylesheet name="layouts/styles/style.css" /> 
  -->
  <style>
    /* Only --primary-color is defined by the Freya theme in Ivy 10, 12 and 14 (and inside the Portal iframe) */
    .showcase-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .showcase-item {
      margin: 0;
    }
    .showcase-link {
      --showcase-accent: var(--primary-color, #1b6ea1);
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      border: 1px solid var(--showcase-accent);
      border-radius: 6px;
      background: transparent;
      color: var(--showcase-accent) !important;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none !important;
      transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .showcase-link:hover,
    .showcase-link:focus-visible {
      background: color-mix(in srgb, var(--showcase-accent) 12%, transparent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
      outline: none;
    }
    /* The showcase currently displayed */
    .showcase-link.active {
      background: var(--showcase-accent);
      color: #ffffff !important;
      font-weight: 600;
      cursor: default;
    }
  </style>
</h:head>
<h:body class="body-hd">
  <ui:include src="/layouts/includes/progress-loader.xhtml" />
  <div id="content" class="container frame full-width">
    <!-- Demo process quick links (generated) -->
    
    <div class="demo-process-links" style="padding:0.5rem 1rem;">
      <h:panelGroup rendered="#{not empty processStartListBean.demoProcessStarts}">
        <hr/>
				<h3>Other Showcases</h3>
				<ul class="showcase-list">
          <ui:repeat value="#{processStartListBean.demoProcessStarts}" var="link">
            <li class="showcase-item">
              <h:outputLink value="#{link.relative}" class="showcase-link#{link.active ? ' active' : ''}" target="_blank"
                pt:aria-current="#{link.active ? 'page' : 'false'}">#{link.name}</h:outputLink>
            </li>
          </ui:repeat>
        </ul>
        <hr/>
      </h:panelGroup>
    </div>
    <ui:insert name="content">
      default content
    </ui:insert>
    
    <!-- Automatic Source Code Viewer -->
    <ui:include src="/layouts/includes/show-source.xhtml">
      <ui:param name="autoDetect" value="true" />
    </ui:include>
  </div>
  
  <ui:insert name="exception">
    <ui:include src="/layouts/includes/exception.xhtml" />
  </ui:insert>

  <!-- optional Portal parameters:
  <script>
    window.
  </script>
  -->

</h:body>
</html>
